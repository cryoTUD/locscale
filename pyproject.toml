[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locscale"
version = "2.4.0+colab1"
authors = [
    { name = "Alok Bharadwaj" },
    { name = "Arjen J. Jakobi" },
    { name = "Reinier de Bruin" }
]
description = "Contrast optimization for cryo-EM maps"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "3-Clause BSD" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "gemmi>=0.7,<0.8",
    "servalcat>=0.4,<0.5",
    "mrcfile>=1.5",
    "pwlf>=2.2",
    "tqdm>=4.66",
    "pyfiglet>=1.0",
    "loguru>=0.7",
]


[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
locscale = [
    "utils/*.pickle",
    "utils/*.pkl",
    "emmernet/emmernet_models/*.pt",
    "*.txt",
]

[project.urls]
Homepage = "https://github.com/cryoTUD/locscale"
"Bug Tracker" = "https://github.com/cryoTUD/locscale/issues"

[project.scripts]
locscale = "locscale.main:main"
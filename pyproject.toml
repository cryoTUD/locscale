[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locscale"
version = "2.4.0"
authors = [
    { name = "Alok Bharadwaj" },
    { name = "Arjen J. Jakobi" },
    { name = "Reinier de Bruin" }
]
description = "Contrast optimization for cryo-EM maps"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "3-Clause BSD" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
]

[tool.setuptools]
packages = ["locscale"]

[project.urls]
Homepage = "https://github.com/cryoTUD/locscale"
"Bug Tracker" = "https://github.com/cryoTUD/locscale/issues"

[project.scripts]
locscale = "locscale.main:main"
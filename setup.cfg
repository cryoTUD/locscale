[metadata]
description-file=README.md
license_files=LICENSE.rst
[options]
packages = find:
install_requires =
    numpy>=1.21,<=1.26
    scipy>=1.5,<=1.15
    pandas>=1.1.5,<=2.2
    scikit-learn==1.6
    matplotlib>=3.3.4,<=3.7
    seaborn>=0.11,<=0.13
    biopython>=1.78,<=1.85
    mrcfile>=1.3.0,<=1.5
    pypdb==2.0
    tensorflow[and-cuda]==2.15.0.post1; platform_system != "Darwin"
    tensorflow >=2.13; platform_system == "Darwin"
    tensorflow-datasets>=4.8
    more_itertools>=8.10.0
    servalcat==0.4.*
    pwlf==2.0
    tqdm==4.62
    pyfiglet==0.8.post1
    wget==3.2
    loguru
[options.extras_require]
mac = 
    tensorflow-macos>=2.13
    tensorflow-metal

[options.package_data]
locscale = 
    utils/*.pickle
    utils/*.pkl
    include/symmetry_emda/*.f90
    emmernet/emmernet_models/*.tar.gz
    emmernet/emmernet_models/*.hdf5
    *.txt
